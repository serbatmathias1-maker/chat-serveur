<!DOCTYPE html>
<html lang="fr" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Messagerie Secrète E2EE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { touch-action: manipulation; }
    .h-dvh { height: 100dvh; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-dvh flex flex-col font-sans overflow-hidden select-none">

  <!-- MODAL CONNEXION / INSCRIPTION -->
  <div id="auth-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-2xl w-full max-w-sm">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-emerald-500/20">
          <i class="fa-solid fa-shield-halved text-3xl"></i>
        </div>
        <h2 id="auth-title" class="text-2xl font-bold">Connexion</h2>
        <p class="text-slate-400 text-xs mt-1">Messagerie privée E2EE</p>
      </div>

      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Pseudo</label>
          <input type="text" id="auth-username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Mot de passe</label>
          <input type="password" id="auth-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors">
        </div>

        <button type="submit" id="auth-submit-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg transition-all active:scale-[0.98]">
          Se connecter
        </button>
      </form>

      <div class="mt-4 text-center">
        <button type="button" onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-xs text-slate-400 hover:text-emerald-400 transition-colors">
          Pas encore de compte ? S'inscrire
        </button>
      </div>
      <p id="auth-error" class="text-red-400 text-xs text-center mt-3 hidden"></p>
    </div>
  </div>

  <!-- INTERFACE PRINCIPALE DE CHAT -->
  <div id="app-interface" class="hidden flex-col h-full">
    <!-- EN-TÊTE -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between shrink-0">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center font-bold">
          <span id="user-avatar">?</span>
        </div>
        <div>
          <h1 id="user-display" class="font-bold text-sm">Chargement...</h1>
          <span class="inline-flex items-center text-[10px] text-emerald-400">
            <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full mr-1 animate-pulse"></span> Chiffré E2EE
          </span>
        </div>
      </div>
      <button onclick="logout()" class="text-slate-400 hover:text-red-400 p-2 transition-colors">
        <i class="fa-solid fa-right-from-bracket text-lg"></i>
      </button>
    </header>

    <!-- ZONE DES MESSAGES -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-950">
      <div class="text-center my-4">
        <span class="bg-slate-900 text-slate-500 text-[10px] px-3 py-1 rounded-full border border-slate-800">
          Les messages sont chiffrés de bout en bout
        </span>
      </div>
    </main>

    <!-- BARRE D'ENVOI MOBILE -->
    <footer class="bg-slate-900 border-t border-slate-800 p-3 shrink-0">
      <form id="chat-form" onsubmit="sendMessage(event)" class="flex items-center space-x-2">
        <input type="text" id="recipient-input" placeholder="Destinataire" required class="w-1/3 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
        <input type="text" id="message-input" placeholder="Message..." required class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
        <button type="submit" class="bg-emerald-500 text-slate-950 p-2.5 rounded-xl font-bold flex items-center justify-center hover:bg-emerald-400 active:scale-95 transition-all">
          <i class="fa-solid fa-paper-plane text-sm"></i>
        </button>
      </form>
    </footer>
  </div>

  <script>
    // ADRESSE DE TON SERVEUR RENDER
    const SERVER_URL = "https://chat-serveur.onrender.com";
    const socket = io(SERVER_URL, { autoConnect: false });

    let currentUser = null;
    let userKey = null;
    let isLoginMode = true;

    // --- SÉCURITÉ ET CHIFFREMENT (WEB CRYPTO API) ---
    async function deriveKey(password, salt = "chat-e2ee-salt") {
      const enc = new TextEncoder();
      const keyMaterial = await window.crypto.subtle.importKey(
        "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      return window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: enc.encode(salt), iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function hashPassword(password) {
      const enc = new TextEncoder();
      const buf = await window.crypto.subtle.digest("SHA-256", enc.encode(password));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function encryptPayload(text, key) {
      const enc = new TextEncoder();
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const ciphertext = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv }, key, enc.encode(text)
      );
      return {
        iv: Array.from(iv),
        data: Array.from(new Uint8Array(ciphertext))
      };
    }

    async function decryptPayload(payload, key) {
      try {
        const iv = new Uint8Array(payload.iv);
        const data = new Uint8Array(payload.data);
        const decrypted = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv }, key, data
        );
        return new TextDecoder().decode(decrypted);
      } catch (e) {
        return "⚠️ Message indisponible (clé incompatible)";
      }
    }

    // --- GESTION CONNEXION / INSCRIPTION ---
    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('auth-title').innerText = isLoginMode ? "Connexion" : "Inscription";
      document.getElementById('auth-submit-btn').innerText = isLoginMode ? "Se connecter" : "S'inscrire";
      document.getElementById('auth-toggle-btn').innerText = isLoginMode ? "Pas encore de compte ? S'inscrire" : "Déjà un compte ? Se connecter";
      document.getElementById('auth-error').classList.add('hidden');
    }

    async function handleAuth(e) {
      e.preventDefault();
      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value;
      const errorEl = document.getElementById('auth-error');

      if (!username || !password) return;

      errorEl.classList.add('hidden');
      const passHash = await hashPassword(password);
      userKey = await deriveKey(password);

      socket.connect();

      const event = isLoginMode ? 'login' : 'register';
      socket.emit(event, { username, passwordHash: passHash }, async (res) => {
        if (res.success) {
          currentUser = username;
          document.getElementById('auth-modal').classList.add('hidden');
          document.getElementById('app-interface').classList.remove('hidden');
          document.getElementById('app-interface').classList.add('flex');
          document.getElementById('user-display').innerText = username;
          document.getElementById('user-avatar').innerText = username[0].toUpperCase();

          // Charger les messages hors-ligne s'il y en a
          if (res.messages && res.messages.length > 0) {
            for (const msg of res.messages) {
              const text = await decryptPayload(msg.encryptedPayload, userKey);
              appendMessage(msg.sender, text, false);
            }
          }
        } else {
          errorEl.innerText = res.message;
          errorEl.classList.remove('hidden');
          socket.disconnect();
        }
      });
    }

    function logout() {
      location.reload();
    }

    // --- GESTION DES MESSAGES ---
    async function sendMessage(e) {
      e.preventDefault();
      const recipient = document.getElementById('recipient-input').value.trim();
      const messageInput = document.getElementById('message-input');
      const text = messageInput.value.trim();

      if (!recipient || !text) return;

      const encrypted = await encryptPayload(text, userKey);
      const messageData = {
        sender: currentUser,
        encryptedPayload: encrypted
      };

      socket.emit('send-message', { recipient, messageData }, (res) => {
        if (res.success) {
          appendMessage("Moi", text, true);
          messageInput.value = "";
        }
      });
    }

    socket.on('new-message', async (messageData) => {
      const text = await decryptPayload(messageData.encryptedPayload, userKey);
      appendMessage(messageData.sender, text, false);
    });

    function appendMessage(sender, text, isMe) {
      const chatBox = document.getElementById('chat-box');
      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;

      const bubble = document.createElement('div');
      bubble.className = `max-w-[80%] rounded-2xl px-4 py-2 text-sm shadow-sm ${
        isMe ? 'bg-emerald-500 text-slate-950 rounded-br-none font-medium' : 'bg-slate-900 border border-slate-800 text-slate-100 rounded-bl-none'
      }`;

      if (!isMe) {
        const senderName = document.createElement('div');
        senderName.className = "text-[10px] text-emerald-400 font-bold mb-0.5";
        senderName.innerText = sender;
        bubble.appendChild(senderName);
      }

      const msgText = document.createElement('div');
      msgText.innerText = text;
      bubble.appendChild(msgText);

      wrapper.appendChild(bubble);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
