<!DOCTYPE html>
<html lang="fr" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Messagerie Privée</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { touch-action: manipulation; }
    .h-dvh { height: 100dvh; }

    .break-words-custom {
      word-break: break-word;
      overflow-wrap: break-word;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-message {
      animation: fadeInScale 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .animate-slide {
      animation: slideInRight 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-dvh flex flex-col font-sans overflow-hidden select-none">

  <!-- MODAL CONNEXION / INSCRIPTION -->
  <div id="auth-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4 transition-all duration-300">
    <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-2xl w-full max-w-sm animate-message">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-emerald-500/25 shadow-lg shadow-emerald-500/10">
          <i class="fa-solid fa-comments text-3xl animate-bounce"></i>
        </div>
        <h2 id="auth-title" class="text-2xl font-bold">Connexion</h2>
        <p class="text-slate-400 text-xs mt-1">Messagerie sécurisée</p>
      </div>

      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Pseudo</label>
          <input type="text" id="auth-username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition-all duration-200">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Mot de passe</label>
          <input type="password" id="auth-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition-all duration-200">
        </div>

        <div id="ntfy-field-container" class="hidden">
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Nom du canal Ntfy <span class="text-slate-500 lowercase">(optionnel)</span></label>
          <input type="text" id="auth-ntfy" placeholder="ex: mon-chat-secret-xyz" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition-all duration-200">
          <p class="text-[10px] text-slate-500 mt-1">Nécessaire pour recevoir les alertes hors-ligne.</p>
        </div>

        <button type="submit" id="auth-submit-btn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg shadow-emerald-500/20 transition-all duration-200 active:scale-[0.98]">
          Se connecter
        </button>
      </form>

      <div class="mt-4 text-center">
        <button type="button" onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-xs text-slate-400 hover:text-emerald-400 transition-colors">
          Pas encore de compte ? S'inscrire
        </button>
      </div>
      <p id="auth-error" class="text-red-400 text-xs text-center mt-3 hidden"></p>
    </div>
  </div>

  <!-- INTERFACE PRINCIPALE -->
  <div id="app-interface" class="hidden flex-1 h-full flex overflow-hidden">
    
    <!-- BARRE LATÉRALE -->
    <aside id="sidebar" class="w-full md:w-80 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 h-full transition-all duration-300">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center font-bold shadow-inner">
            <span id="user-avatar">?</span>
          </div>
          <div>
            <h1 id="user-display" class="font-bold text-sm">Chargement...</h1>
            <span class="inline-flex items-center text-[10px] text-emerald-400">
              <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full mr-1 animate-pulse"></span> En ligne
            </span>
          </div>
        </div>
        <button onclick="logout()" class="text-slate-400 hover:text-red-400 p-2 transition-colors duration-200" title="Se déconnecter">
          <i class="fa-solid fa-right-from-bracket text-base"></i>
        </button>
      </div>

      <div class="p-3 border-b border-slate-800/60 bg-slate-950/40 space-y-2">
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Canal d'alerte (Ntfy)</div>
        <div class="flex items-center space-x-2">
          <input type="text" id="settings-ntfy" placeholder="Nom de ton canal" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors">
          <button onclick="saveNtfySetting()" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 px-3 py-1.5 rounded-xl text-xs font-bold transition-all active:scale-95" title="Sauvegarder">
            <i class="fa-solid fa-floppy-disk"></i>
          </button>
        </div>
        <div class="flex items-center space-x-2 pt-1">
          <a href="https://ntfy.sh" target="_blank" class="flex-1 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 text-center py-1.5 rounded-xl text-[11px] font-semibold transition-all">
            <i class="fa-solid fa-download mr-1"></i> Appli Ntfy
          </a>
          <button onclick="openDirectNtfyChannel()" class="flex-1 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 border border-emerald-500/30 text-center py-1.5 rounded-xl text-[11px] font-semibold transition-all">
            <i class="fa-solid fa-bell mr-1"></i> Ouvrir Canal
          </button>
        </div>
      </div>

      <div class="p-3 border-b border-slate-800/60">
        <form onsubmit="startNewChat(event)" class="flex items-center space-x-2">
          <input type="text" id="new-chat-input" placeholder="Pseudo de l'ami..." required class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors">
          <button type="submit" class="bg-emerald-500 text-slate-950 p-2 rounded-xl text-xs font-bold hover:bg-emerald-400 transition-all active:scale-95">
            <i class="fa-solid fa-plus"></i>
          </button>
        </form>
      </div>

      <div class="p-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Annonces & Mises à jour</div>
      <div id="channels-list" class="px-2 space-y-1 mb-2"></div>

      <div class="p-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Messages Privés</div>
      <div id="conversations-list" class="flex-1 overflow-y-auto px-2 space-y-1"></div>
    </aside>

    <!-- ZONE DE DISCUSSION -->
    <main id="chat-window" class="hidden md:flex flex-1 flex-col h-full bg-slate-950 transition-all duration-300 animate-slide">
      <header id="chat-header" class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
          <button onclick="showSidebarOnMobile()" class="md:hidden text-slate-400 hover:text-slate-200 p-1 mr-1 transition-colors">
            <i class="fa-solid fa-arrow-left text-lg"></i>
          </button>
          <div class="w-9 h-9 bg-slate-800 text-emerald-400 rounded-full flex items-center justify-center font-bold text-sm shadow-inner">
            <span id="active-chat-avatar">@</span>
          </div>
          <div>
            <h2 id="active-chat-name" class="font-bold text-sm">Sélectionnez une discussion</h2>
            <p id="active-chat-status" class="text-[10px] text-slate-400 transition-all">Hors ligne</p>
          </div>
        </div>
      </header>

      <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div id="no-chat-selected" class="h-full flex flex-col items-center justify-center text-slate-500 space-y-2 animate-message">
          <i class="fa-regular fa-comments text-4xl text-slate-600"></i>
          <p class="text-xs">Sélectionne un ami à gauche ou démarre un nouveau MP</p>
        </div>
      </div>

      <!-- Footer d'envoi avec boutons Photo et Vocal -->
      <footer id="chat-footer" class="bg-slate-900 border-t border-slate-800 p-3 shrink-0 hidden">
        <form id="chat-form" onsubmit="sendMessage(event)" class="flex items-center space-x-2">
          <!-- Input photo caché -->
          <input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
          <button type="button" onclick="document.getElementById('image-input').click()" class="text-slate-400 hover:text-emerald-400 p-2 transition-transform active:scale-90" title="Envoyer une photo">
            <i class="fa-solid fa-image text-lg"></i>
          </button>

          <!-- Bouton vocal -->
          <button type="button" id="mic-btn" onclick="toggleVoiceRecording()" class="text-slate-400 hover:text-red-400 p-2 transition-transform active:scale-90" title="Enregistrer un vocal">
            <i class="fa-solid fa-microphone text-lg" id="mic-icon"></i>
          </button>

          <input type="text" id="message-input" placeholder="Envoyer un message..." autocomplete="off" oninput="handleTypingInput()" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition-all">
          
          <button type="submit" id="send-btn" class="bg-emerald-500 text-slate-950 p-2.5 rounded-xl font-bold flex items-center justify-center hover:bg-emerald-400 active:scale-95 transition-all shadow-md shadow-emerald-500/10">
            <i class="fa-solid fa-paper-plane text-sm"></i>
          </button>
        </form>
      </footer>
    </main>

  </div>

  <script>
    const SERVER_URL = "https://chat-serveur.onrender.com";
    const socket = io(SERVER_URL, { autoConnect: false });

    let currentUser = null;
    let isLoginMode = true;
    let activeRecipient = null;
    const chats = { 'patchnote': [] };
    const unreadCounts = {}; 
    const onlineUsersList = new Set();
    const userLastSeen = {};

    let typingTimeout;
    let isTyping = false;

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    async function hashPassword(password) {
      const enc = new TextEncoder();
      const buf = await window.crypto.subtle.digest("SHA-256", enc.encode(password));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('chat_username');
      const savedPassHash = localStorage.getItem('chat_passhash');

      if (savedUser && savedPassHash) {
        performLogin(savedUser, savedPassHash, true);
      }
    });

    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('auth-title').innerText = isLoginMode ? "Connexion" : "Inscription";
      document.getElementById('auth-submit-btn').innerText = isLoginMode ? "Se connecter" : "S'inscrire";
      document.getElementById('auth-toggle-btn').innerText = isLoginMode ? "Pas encore de compte ? S'inscrire" : "Déjà un compte ? Se connecter";
      
      const ntfyContainer = document.getElementById('ntfy-field-container');
      if (isLoginMode) {
        ntfyContainer.classList.add('hidden');
      } else {
        ntfyContainer.classList.remove('hidden');
      }
      document.getElementById('auth-error').classList.add('hidden');
    }

    async function handleAuth(e) {
      e.preventDefault();
      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value;
      const ntfyTopic = document.getElementById('auth-ntfy').value.trim();
      const errorEl = document.getElementById('auth-error');

      if (!username || !password) return;

      errorEl.classList.add('hidden');
      const passHash = await hashPassword(password);
      performLogin(username, passHash, false, ntfyTopic);
    }

    function performLogin(username, passHash, isAuto, ntfyTopic = "") {
      socket.connect();

      if (!isAuto && !isLoginMode) {
        socket.emit('register', { username, passwordHash: passHash, ntfyTopic }, (res) => {
          if (res.success) {
            performLogin(username, passHash, true);
          } else {
            showAuthError(res.message);
            socket.disconnect();
          }
        });
        return;
      }

      socket.emit('login', { username, passwordHash: passHash }, (res) => {
        if (res.success) {
          currentUser = username;
          localStorage.setItem('chat_username', username);
          localStorage.setItem('chat_passhash', passHash);

          document.getElementById('auth-modal').classList.add('hidden');
          document.getElementById('app-interface').classList.remove('hidden');
          document.getElementById('app-interface').classList.add('flex');
          document.getElementById('user-display').innerText = username;
          document.getElementById('user-avatar').innerText = username[0].toUpperCase();
          
          if (res.ntfyTopic) {
            document.getElementById('settings-ntfy').value = res.ntfyTopic;
          }

          if (res.history && res.history.length > 0) {
            for (const msg of res.history) {
              const msgTime = new Date(msg.timestamp || Date.now());
              const time = msgTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              const isMe = (msg.sender === currentUser);
              
              if (msg.recipient === 'patchnote') {
                chats['patchnote'].push({ sender: msg.sender, text: msg.text, type: msg.type || 'text', isMe, time, timestamp: msgTime.getTime(), read: msg.read });
              } else {
                const peer = isMe ? msg.recipient : msg.sender;
                if (!chats[peer]) chats[peer] = [];
                chats[peer].push({ sender: msg.sender, text: msg.text, type: msg.type || 'text', isMe, time, timestamp: msgTime.getTime(), read: msg.read });
              }
            }
          }
          renderConversationsList();
        } else {
          if (isAuto) {
            localStorage.removeItem('chat_username');
            localStorage.removeItem('chat_passhash');
            socket.disconnect();
          } else {
            showAuthError(res.message);
            socket.disconnect();
          }
        }
      });
    }

    function saveNtfySetting() {
      const ntfyTopic = document.getElementById('settings-ntfy').value.trim();
      socket.emit('update-ntfy', { ntfyTopic }, (res) => {
        if (res.success) alert("Canal d'alerte mis à jour avec succès !");
        else alert("Erreur lors de la mise à jour.");
      });
    }

    function openDirectNtfyChannel() {
      const ntfyTopic = document.getElementById('settings-ntfy').value.trim();
      if (!ntfyTopic) {
        alert("Veuillez d'abord renseigner et enregistrer un nom de canal !");
        return;
      }
      window.open(`https://ntfy.sh/${ntfyTopic}`, '_blank');
    }

    function showAuthError(msg) {
      const errorEl = document.getElementById('auth-error');
      errorEl.innerText = msg;
      errorEl.classList.remove('hidden');
    }

    function logout() {
      localStorage.removeItem('chat_username');
      localStorage.removeItem('chat_passhash');
      location.reload();
    }

    function startNewChat(e) {
      e.preventDefault();
      const input = document.getElementById('new-chat-input');
      const targetUser = input.value.trim();
      
      if (!targetUser || targetUser === currentUser) return;

      if (!chats[targetUser]) chats[targetUser] = [];
      input.value = "";
      selectChat(targetUser);
    }

    function selectChat(recipient) {
      activeRecipient = recipient;
      if (!chats[recipient]) chats[recipient] = [];
      
      unreadCounts[recipient] = 0;

      if (recipient !== 'patchnote') {
        socket.emit('mark-read', { sender: recipient });
        chats[recipient].forEach(m => { if (!m.isMe) m.read = true; });
      }

      const isPatchnote = (recipient === 'patchnote');
      document.getElementById('active-chat-name').innerText = isPatchnote ? "#patchnote" : `@${recipient}`;
      document.getElementById('active-chat-avatar').innerText = isPatchnote ? "#" : recipient[0].toUpperCase();
      
      updateActiveChatStatusHeader();

      const chatFooter = document.getElementById('chat-footer');
      chatFooter.classList.remove('hidden');

      const allowedAdmins = ['Wifmat', 'Vortex'];
      const isAdmin = allowedAdmins.some(admin => admin.toLowerCase() === currentUser.toLowerCase());

      if (isPatchnote && !isAdmin) {
        chatFooter.classList.add('hidden');
      }

      const sidebar = document.getElementById('sidebar');
      const chatWindow = document.getElementById('chat-window');
      
      sidebar.classList.add('hidden', 'md:flex');
      chatWindow.classList.remove('hidden');
      chatWindow.classList.add('flex');

      renderMessages();
      renderConversationsList();
    }

    function updateActiveChatStatusHeader() {
      const statusEl = document.getElementById('active-chat-status');
      if (!activeRecipient || activeRecipient === 'patchnote') {
        statusEl.innerText = "Canal d'annonces officielles";
        statusEl.className = "text-[10px] text-slate-400";
        return;
      }

      if (onlineUsersList.has(activeRecipient)) {
        statusEl.innerHTML = `<span class="inline-block w-1.5 h-1.5 bg-emerald-400 rounded-full mr-1 animate-pulse"></span> En ligne`;
        statusEl.className = "text-[10px] text-emerald-400 font-semibold";
      } else {
        const lastSeenTime = userLastSeen[activeRecipient];
        if (lastSeenTime) {
          const date = new Date(lastSeenTime);
          const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const dateStr = date.toLocaleDateString();
          statusEl.innerText = `Vu dernière fois le ${dateStr} à ${timeStr}`;
        } else {
          statusEl.innerText = "Hors ligne";
        }
        statusEl.className = "text-[10px] text-slate-500";
      }
    }

    function showSidebarOnMobile() {
      document.getElementById('sidebar').classList.remove('hidden');
      document.getElementById('chat-window').classList.add('hidden');
      document.getElementById('chat-window').classList.remove('flex');
    }

    // Gestion centralisée et propre pour stocker et afficher un message sans doublon ni saut d'écran
    function storeMessage(targetKey, sender, text, type, isMe, timestamp, read, skipDOM = false) {
      if (!chats[targetKey]) chats[targetKey] = [];
      const msgTime = timestamp ? new Date(timestamp) : new Date();
      const time = msgTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const timeMs = msgTime.getTime();

      // Évite les doublons stricts si le message vient d'arriver par socket alors qu'on l'avait déjà créé en local
      const isDuplicate = chats[targetKey].some(m => 
        m.sender === sender && 
        m.text === text && 
        Math.abs(m.timestamp - timeMs) < 3000
      );

      if (isDuplicate) return;

      const messageObj = { 
        sender, 
        text, 
        type: type || 'text', 
        isMe, 
        time, 
        timestamp: timeMs, 
        read: read !== undefined ? read : (isMe ? false : (activeRecipient === targetKey)) 
      };

      chats[targetKey].push(messageObj);

      if (sender !== currentUser && activeRecipient !== targetKey) {
        unreadCounts[targetKey] = (unreadCounts[targetKey] || 0) + 1;
      }
      
      if (activeRecipient === targetKey && !skipDOM) {
        appendMessageDOM(messageObj);
      }

      renderConversationsList();
    }

    function appendMessageDOM(msg) {
      const chatBox = document.getElementById('chat-box');
      
      const emptyState = document.getElementById('no-chat-selected');
      if (emptyState && chatBox.contains(emptyState)) {
        chatBox.innerHTML = "";
      }

      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col ${msg.isMe ? 'items-end' : 'items-start'} animate-message`;

      const bubble = document.createElement('div');
      bubble.className = `max-w-[80%] rounded-2xl px-4 py-2 text-xs shadow-md transition-all break-words-custom ${
        msg.isMe ? 'bg-emerald-500 text-slate-950 rounded-br-none font-medium' : 'bg-slate-900 border border-slate-800 text-slate-100 rounded-bl-none'
      }`;

      if (activeRecipient === 'patchnote' && !msg.isMe) {
        const authorDiv = document.createElement('div');
        authorDiv.className = 'text-[10px] font-bold text-emerald-400 mb-0.5';
        authorDiv.innerText = msg.sender;
        bubble.appendChild(authorDiv);
      }

      if (msg.type === 'image') {
        const img = document.createElement('img');
        img.src = msg.text;
        img.className = 'rounded-lg max-h-48 object-cover cursor-pointer mt-1 mb-1 hover:opacity-95 transition-opacity';
        img.onclick = () => window.open(msg.text);
        bubble.appendChild(img);
      } else if (msg.type === 'audio') {
        const audio = document.createElement('audio');
        audio.src = msg.text;
        audio.controls = true;
        audio.className = 'max-w-full h-8 mt-1 mb-1';
        bubble.appendChild(audio);
      } else {
        const textDiv = document.createElement('div');
        textDiv.innerText = msg.text;
        bubble.appendChild(textDiv);
      }

      const footerDiv = document.createElement('div');
      footerDiv.className = `text-[9px] mt-1 flex items-center justify-end space-x-1 ${msg.isMe ? 'text-slate-800' : 'text-slate-500'}`;
      
      const timeSpan = document.createElement('span');
      timeSpan.innerText = msg.time;
      footerDiv.appendChild(timeSpan);

      if (msg.isMe && activeRecipient !== 'patchnote') {
        const readSpan = document.createElement('span');
        readSpan.className = "ml-1 font-bold transition-all";
        if (msg.read) {
          readSpan.innerText = "✓✓ Vu";
          readSpan.className += " text-slate-900";
        } else {
          readSpan.innerText = "✓ Envoyé";
          readSpan.className += " text-slate-700";
        }
        footerDiv.appendChild(readSpan);
      }

      bubble.appendChild(footerDiv);
      wrapper.appendChild(bubble);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderMessages() {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = "";

      if (!activeRecipient || !chats[activeRecipient]) return;

      const msgs = chats[activeRecipient];

      if (msgs.length === 0) {
        chatBox.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-slate-600 space-y-1 animate-message" id="no-chat-selected">
            <p class="text-xs">C'est le début de cette discussion</p>
            <p class="text-[10px]">Envoyez votre premier message !</p>
          </div>
        `;
        return;
      }

      msgs.forEach(msg => {
        appendMessageDOM(msg);
      });
    }

    function renderConversationsList() {
      const channelsEl = document.getElementById('channels-list');
      channelsEl.innerHTML = "";

      const isPatchnoteActive = (activeRecipient === 'patchnote');
      const patchnoteBtn = document.createElement('button');
      patchnoteBtn.onclick = () => selectChat('patchnote');
      patchnoteBtn.className = `w-full flex items-center space-x-3 p-2.5 rounded-xl text-left transition-all duration-200 ${
        isPatchnoteActive ? 'bg-slate-800 text-slate-100 font-semibold shadow-md' : 'hover:bg-slate-800/50 text-slate-400'
      }`;
      patchnoteBtn.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs shrink-0">#</div>
        <div class="flex-1 overflow-hidden">
          <div class="text-xs font-bold truncate text-slate-200">patchnote</div>
          <div class="text-[11px] text-slate-500 truncate">Mises à jour officielles</div>
        </div>
      `;
      channelsEl.appendChild(patchnoteBtn);

      const listEl = document.getElementById('conversations-list');
      listEl.innerHTML = "";

      const peers = Object.keys(chats).filter(k => k !== 'patchnote');

      if (peers.length === 0) {
        listEl.innerHTML = `<div class="text-xs text-slate-600 px-3 py-2 italic">Aucune conversation</div>`;
        return;
      }

      peers.sort((a, b) => {
        const msgsA = chats[a];
        const msgsB = chats[b];
        const lastA = msgsA.length > 0 ? (msgsA[msgsA.length - 1].timestamp || 0) : 0;
        const lastB = msgsB.length > 0 ? (msgsB[msgsB.length - 1].timestamp || 0) : 0;
        return lastB - lastA;
      });

      peers.forEach(peer => {
        const msgs = chats[peer];
        const lastMsgObj = msgs.length > 0 ? msgs[msgs.length - 1] : null;
        let lastMsgText = "Nouvelle conversation";
        if (lastMsgObj) {
          if (lastMsgObj.type === 'image') lastMsgText = "[Photo]";
          else if (lastMsgObj.type === 'audio') lastMsgText = "[Message vocal]";
          else lastMsgText = lastMsgObj.text;
        }

        const isActive = peer === activeRecipient;
        const unread = unreadCounts[peer] || 0;
        const isOnline = onlineUsersList.has(peer);

        const btn = document.createElement('button');
        btn.onclick = () => selectChat(peer);
        btn.className = `w-full flex items-center space-x-3 p-2.5 rounded-xl text-left transition-all duration-200 ${
          isActive ? 'bg-slate-800 text-slate-100 font-semibold shadow-md scale-[0.99]' : 'hover:bg-slate-800/50 text-slate-400'
        }`;

        btn.innerHTML = `
          <div class="relative shrink-0">
            <div class="w-8 h-8 rounded-full ${isActive ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300'} flex items-center justify-center font-bold text-xs transition-colors">
              ${peer[0].toUpperCase()}
            </div>
            ${isOnline ? '<span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 border-2 border-slate-900 rounded-full animate-pulse"></span>' : ''}
          </div>
          <div class="flex-1 overflow-hidden">
            <div class="text-xs font-bold truncate text-slate-200">@${peer}</div>
            <div class="text-[11px] text-slate-500 truncate">${lastMsgText}</div>
          </div>
          ${unread > 0 ? `<div class="bg-emerald-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 animate-bounce">${unread}</div>` : ''}
        `;
        listEl.appendChild(btn);
      });
    }

    async function sendMessage(e) {
      e.preventDefault();
      if (!activeRecipient) return;

      const messageInput = document.getElementById('message-input');
      const text = messageInput.value.trim();
      if (!text) return;

      // Affichage immédiat en local avec animation (skipDOM false) pour éviter toute latence
      storeMessage(activeRecipient, currentUser, text, 'text', true, Date.now(), false);
      messageInput.value = "";
      socket.emit('stop-typing', { recipient: activeRecipient });

      socket.emit('send-message', { recipient: activeRecipient, text, type: 'text' }, (res) => {
        if (!res || !res.success) {
          alert("Erreur d'envoi du message.");
        }
      });
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file || !activeRecipient) return;

      const reader = new FileReader();
      reader.onload = function(uploadEvent) {
        const base64Image = uploadEvent.target.result;
        storeMessage(activeRecipient, currentUser, base64Image, 'image', true, Date.now(), false);

        socket.emit('send-message', { recipient: activeRecipient, text: base64Image, type: 'image' }, (res) => {
          if (!res || !res.success) {
            alert("Erreur lors de l'envoi de l'image.");
          }
        });
      };
      reader.readAsDataURL(file);
    }

    async function toggleVoiceRecording() {
      const micIcon = document.getElementById('mic-icon');
      const micBtn = document.getElementById('mic-btn');

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = event => {
            audioChunks.push(event.data);
          };

          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = function() {
              const base64Audio = reader.result;
              storeMessage(activeRecipient, currentUser, base64Audio, 'audio', true, Date.now(), false);

              socket.emit('send-message', { recipient: activeRecipient, text: base64Audio, type: 'audio' }, (res) => {
                if (!res || !res.success) {
                  alert("Erreur d'envoi du vocal.");
                }
              });
            };
          };

          mediaRecorder.start();
          isRecording = true;
          micIcon.className = "fa-solid fa-stop text-lg animate-bounce text-red-500";
          micBtn.title = "Arrêter et envoyer";
        } catch (err) {
          alert("Impossible d'accéder au microphone.");
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        micIcon.className = "fa-solid fa-microphone text-lg";
        micBtn.title = "Enregistrer un vocal";
      }
    }

    function handleTypingInput() {
      if (!activeRecipient || activeRecipient === 'patchnote') return;

      if (!isTyping) {
        isTyping = true;
        socket.emit('typing', { recipient: activeRecipient });
      }

      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        isTyping = false;
        socket.emit('stop-typing', { recipient: activeRecipient });
      }, 1500);
    }

    socket.on('new-message', (data) => {
      const isMe = (data.sender === currentUser);
      // Si c'est nous qui l'avons envoyé, storeMessage gère déjà le filtre anti-doublon
      if (data.recipient === 'patchnote') {
        storeMessage('patchnote', data.sender, data.text, data.type, isMe, data.timestamp, data.read);
      } else {
        const peer = isMe ? activeRecipient : data.sender;
        storeMessage(peer, data.sender, data.text, data.type, isMe, data.timestamp, data.read);
      }
    });

    socket.on('presence-update', (data) => {
      onlineUsersList.clear();
      
      const activeArray = Array.isArray(data) ? data : (data.onlineUsers || []);
      const lastSeenMap = data.lastSeenMap || {};

      activeArray.forEach(u => onlineUsersList.add(u));
      
      for (const [user, time] of Object.entries(lastSeenMap)) {
        userLastSeen[user] = time;
      }

      updateActiveChatStatusHeader();
      renderConversationsList();
    });

    socket.on('messages-read', ({ reader }) => {
      if (chats[reader]) {
        chats[reader].forEach(msg => {
          if (msg.isMe) msg.read = true;
        });
        if (activeRecipient === reader) {
          renderMessages();
        }
      }
    });

    socket.on('user-typing', ({ sender }) => {
      if (activeRecipient === sender) {
        document.getElementById('active-chat-status').innerText = "En train d'écrire...";
        document.getElementById('active-chat-status').className = "text-[10px] text-emerald-400 italic animate-pulse";
      }
    });

    socket.on('user-stop-typing', ({ sender }) => {
      if (activeRecipient === sender) {
        updateActiveChatStatusHeader();
      }
    });

    // --- GESTION DE LA VISIBILITÉ ---
    function setAppActive() {
      if (socket.connected) {
        socket.emit('user-active');
      }
    }

    function setAppInactive() {
      if (socket.connected) {
        socket.emit('user-inactive');
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        setAppActive();
      } else {
        setAppInactive();
      }
    });

    window.addEventListener("pagehide", () => {
      setAppInactive();
    });

    window.addEventListener("blur", () => {
      setAppInactive();
    });

    window.addEventListener("focus", () => {
      setAppActive();
    });
  </script>
</body>
</html>
